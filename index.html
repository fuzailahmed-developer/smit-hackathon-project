<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <meta name="description" content="A pixel-perfect, modern Login and Signup page built with Bootstrap 5 and CSS.">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- css -->
    <link rel="stylesheet" href="./assets/css/auth.css">

</head>

<body>

    <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
        <i class="bi bi-moon-stars-fill"></i>
        <i class="bi bi-sun-fill"></i>
    </button>

    <input type="checkbox" id="auth-toggle-signup">

    <div class="auth-container">
        <div class="auth-card">

            <!-- Left Side: Form Content -->
            <div class="auth-form-content">

                <!-- Login Form -->
                <div class="login-form">
                    <div class="form-header">
                        <h1>Welcome back</h1>
                        <p>Welcome back! Please enter your details.</p>
                    </div>

                    <form onsubmit="signinAccount(event)">
                        <div class="input-group-custom">
                            <i class="bi bi-envelope"></i>
                            <input type="email" class="form-control-custom" placeholder="Email address" 
                                id="email-login" autocomplete="off" autofocus>
                        </div>

                        <div class="input-group-custom">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="form-control-custom" placeholder="Password" 
                                id="password-login" autocomplete="off">
                        </div>

                        <div class="form-options">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">
                                    Remember me
                                </label>
                            </div>
                            <a href="#" class="forgot-link">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn-primary-custom">Sign in</button>

                        <div class="social-auth">
                            <button type="button" class="btn-social">
                                <i class="bi bi-google"></i> Google
                            </button>
                            <button type="button" class="btn-social">
                                <i class="bi bi-github"></i> GitHub
                            </button>
                        </div>
                    </form>

                    <div class="auth-switch">
                        Don't have an account? <label for="auth-toggle-signup">Sign up</label>
                    </div>
                </div>

                <!-- Signup Form -->
                <div class="signup-form">
                    <div class="form-header">
                        <h1>Create an account</h1>
                        <p>Start your 30-day free trial today.</p>
                    </div>

                    <form onsubmit="handleSignup(event)">
                        <div class="input-group-custom">
                            <i class="bi bi-person"></i>
                            <input type="text" class="form-control-custom" placeholder="Full name" 
                                id="name-signup" autocomplete="off">
                        </div>

                        <div class="input-group-custom">
                            <i class="bi bi-envelope"></i>
                            <input type="email" class="form-control-custom" placeholder="Email address" 
                                id="email-signup" autocomplete="off">
                        </div>

                        <div class="input-group-custom">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="form-control-custom" placeholder="Password" 
                                id="password-signup" autocomplete="off">
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="terms" >
                            <label class="form-check-label" for="terms" style="font-size: 0.9rem;">
                                I agree to the <a href="#" class="forgot-link">Terms & Conditions</a>
                            </label>
                        </div>

                        <button type="submit" class="btn-primary-custom">Get started</button>

                        <div class="social-auth">
                            <button type="button" class="btn-social">
                                <i class="bi bi-google"></i> Google
                            </button>
                            <button type="button" class="btn-social">
                                <i class="bi bi-github"></i> GitHub
                            </button>
                        </div>
                    </form>

                    <div class="auth-switch">
                        Already have an account? <label for="auth-toggle-signup">Log in</label>
                    </div>
                </div>

            </div>

            <!-- Right Side: Illustration -->
            <div class="auth-illustration">
                <img src="./assets/images/illustration.png" alt="SaaS Illustration" class="rounded">
            </div>

        </div>

    </div>

    <!-- Bootstrap alert  -->

    <div class="alert" role="alert" id="alert">
        A simple success alert—check it out!
    </div>


    <script src="./assets/js/theme.js"></script>
    <script src="./assets/js/auth.js"></script>
</body>

</html>
